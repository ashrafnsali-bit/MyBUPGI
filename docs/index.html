<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b1018">
    <title>MyBUPGI | لعبة تصويب من منظور الشخص الأول</title>

    <meta name="description" content="MyBUPGI — لعبة تصويب سريعة في المتصفح: أعداء أذكياء، قنابل، سونار، وموجات متصاعدة. العب الآن مجاناً.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="MyBUPGI | أطلق النار الآن">
    <meta property="og:description" content="لعبة FPS عربية سريعة في المتصفح. ابدأ القتال، اكسر رقمك، وشارك نتيجتك.">
    <meta property="og:image" content="TemplateData/webmemd-icon.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        margin: 0;
        background: radial-gradient(circle at 50% 25%, #1b2838 0%, #0b1018 65%);
        color: #fff;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      }
      #unity-container.unity-desktop { margin: 0 auto; }
      #unity-build-title {
        color: #ffc93c;
        font-weight: 700;
        letter-spacing: .3px;
      }
      #unity-loading-bar {
        background: rgba(6, 10, 16, .88);
        border: 1px solid rgba(255, 201, 60, .35);
        border-radius: 14px;
        padding: 22px 26px;
        box-shadow: 0 18px 50px rgba(0,0,0,.45);
      }
      #unity-loading-bar #unity-logo { display: none; }
      .load-title {
        font-size: 26px;
        font-weight: 800;
        color: #ffc93c;
        margin-bottom: 6px;
      }
      .load-sub {
        font-size: 15px;
        color: #cfd8e3;
        margin-bottom: 14px;
      }
      .load-controls {
        font-size: 13px;
        line-height: 2;
        color: #9fb0c3;
        margin-top: 12px;
      }
      #unity-footer { color: #9fb0c3; }
      #unity-fullscreen-button { cursor: pointer; }
      #unity-fullscreen-button::after {
        content: "ملء الشاشة";
        position: absolute;
        white-space: nowrap;
        font-size: 13px;
        margin-top: 34px;
        color: #9fb0c3;
      }
      #unity-warning div {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div class="load-title">🎮 MyBUPGI</div>
        <div class="load-sub">جارٍ تجهيز ساحة المعركة...</div>
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div class="load-controls">
          WASD تحرك &nbsp;•&nbsp; ماوس تصويب &nbsp;•&nbsp; R تعبئة &nbsp;•&nbsp; G قنبلة<br>
          X سونار &nbsp;•&nbsp; F بطء الزمن &nbsp;•&nbsp; Shift اندفاع &nbsp;•&nbsp; L قفل الماوس
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">MyBUPGI | النسخة العربية</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #b3261e; color: #fff; padding: 10px; border-radius: 8px;';
        else {
          if (type == 'warning') div.style = 'background: #ffc93c; color: #111; padding: 10px; border-radius: 8px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      // Cache-busting: bump this whenever the WebGL build is rebuilt so browsers
      // never mix an old loader/framework with a new wasm/data file (that mismatch
      // shows up as "RangeError: Maximum call stack size exceeded at invoke_iii").
      var buildVersion = "1.1.1";
      var v = "?v=" + buildVersion;
      var loaderUrl = buildUrl + "/docs.loader.js" + v;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/docs.data" + v,
        frameworkUrl: buildUrl + "/docs.framework.js" + v,
        codeUrl: buildUrl + "/docs.wasm" + v,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MyBUPGI",
        productName: "MyBUPGI",
        productVersion: "1.1.0",
        showBanner: unityShowBanner
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
        // Keep mobile GPU cost lower; the HUD is scaled by CanvasScaler.
        config.devicePixelRatio = 1;
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          unityShowBanner(message, 'error');
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
